# @package _global_

# TUM evaluation for the VGGT 45k reference (+training=c4g lineage) baseline, run through the same C4G test path as
# the *_omega configs so the two are directly comparable.
defaults:
  - /dataset@_group_.tum: tum
  - override /dataset/view_sampler@dataset.tum.view_sampler: sequential
  - override /model/encoder: vggt
  - override /model/encoder/backbone: vggt_multi
  - override /loss: [dynamicmask, lpips]

wandb:
  name: hs_tum_vggt_ref45k
  mode: disabled
  tags: [tum, evaluation, vggt_multi, baseline]

force_davis_intrinsics: true

model:
  encoder:
    pretrained_weights: ""
    timestamp_embedding: true
    timestamp_embedding_type: sinusoidal
    sinusoidal_embedding_dim: 256
    sinusoidal_period: 10000
    normalize_type: target_1
    gradient_checkpoint: false
  decoder:
    make_scale_invariant: true
    low_pass_filter: 0.3
    decrease_lpf_step: 1000

dataset:
  tum:
    # Same protocol as the July hs_tum eval (hs_tum_v4-4.sh).
    num_frames: 1000
    view_sampler:
      num_context_views: 16
      gap: 6

data_loader:
  test:
    num_workers: 4
    batch_size: 1

test:
  compute_scores: true
  save_image: false
  save_compare: true
  align_pose: true

