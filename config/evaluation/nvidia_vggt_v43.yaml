# @package _global_

# NVIDIA evaluation for the VGGT v4-3 baseline, run through the same C4G test path as
# the *_omega configs so the two are directly comparable.
defaults:
  - /dataset@_group_.nvidia: nvidia
  - override /model/encoder: vggt
  - override /model/encoder/backbone: vggt_multi
  - override /loss: [dynamicmask, lpips]

wandb:
  name: hs_nvidia_vggt_v43
  mode: disabled
  tags: [nvidia, evaluation, vggt_multi, baseline]

force_davis_intrinsics: true

model:
  encoder:
    pretrained_weights: ""
    timestamp_embedding: true
    timestamp_embedding_type: sinusoidal
    sinusoidal_embedding_dim: 256
    sinusoidal_period: 100
    normalize_type: relative
    gradient_checkpoint: false
  decoder:
    make_scale_invariant: true
    low_pass_filter: 0.3
    decrease_lpf_step: 1000

dataset:
  nvidia:
    # Same protocol as the July hs_nvidia eval (hs_nvidia_v4-4.sh).
    num_context_views: 16
    gap: 2
    re10k_intrinsic: true
    view_sampler:
      num_context_views: 3

data_loader:
  test:
    num_workers: 4
    batch_size: 1

test:
  compute_scores: true
  pose_align_steps: 2000
  save_image: false
  save_compare: true
  align_pose: true

