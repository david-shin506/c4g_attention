# @package _global_

# ADT evaluation for the VGGT v4-3 baseline checkpoints, run through the same
# C4G test path as adt_omega.yaml so the two are directly comparable.
# Encoder settings mirror config/training/c4g_v4-3_davisK_all.yaml.
defaults:
  - /dataset@_group_.adt: adt
  - override /model/encoder: vggt
  - override /model/encoder/backbone: vggt_multi
  - override /loss: [dynamicmask, lpips]

wandb:
  name: mg_adt_vggt_v43
  mode: disabled
  tags: [adt, evaluation, vggt_multi, baseline]

force_davis_intrinsics: true

model:
  encoder:
    pretrained_weights: ""
    timestamp_embedding: true
    timestamp_embedding_type: sinusoidal
    sinusoidal_embedding_dim: 256
    sinusoidal_period: 100
    normalize_type: relative
    gradient_checkpoint: false
  decoder:
    make_scale_invariant: true
    low_pass_filter: 0.3
    decrease_lpf_step: 1000

dataset:
  adt:
    num_context_frames: 16
    gap: 6
    view_sampler:
      num_context_views: 3

data_loader:
  test:
    num_workers: 4
    batch_size: 1

test:
  compute_scores: true
  save_image: false
  save_compare: true
  align_pose: true
