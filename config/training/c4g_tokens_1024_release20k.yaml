# @package _global_

defaults:
  - /dataset@_group_.kubric: kubric
  - /dataset@_group_.spring: spring
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: vggt
  - override /model/encoder/backbone: vggt_multi
  - override /loss: [dynamicmask, lpips]

wandb:
  name: all_w_re10k_tokens1024_release20k
  tags: [all, kubric, spring, re10k, vggt, dynamicmask, track, token_ablation, tokens1024, release20k]

force_davis_intrinsics: false

model:
  encoder:
    pretrained_weights: /music-3d-shared-disk/user/KAIST/MG/InterpolatedC3G/c4g/C3G/pretrained_weights/gaussian_decoder.ckpt
    num_gaussians: 1024
    gaussian_token_ablation: first1024

dataset:
  kubric:
    view_sampler:
      warm_up_steps: 37500
  spring:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      gap: 2
      initial_gap: 2
      warm_up_steps: 37500
    different_time: true
    relative_time: false
  re10k:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      warm_up_steps: 37500

optimizer:
  lr: 1e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 1

train:
  context_view_loss: true
  reproj_model: vggt
  depth_supervision_mode: pose_aligned_strict
  strict_depth_loss: log_l1
  depth_confidence_quantile: 0.2
  depth_pose_min_baseline: 1e-4
  depth_pose_min_pair_fraction: 0.2
  depth_pose_max_relative_error: 0.3
  depth_loss: 1e-3
  normal_loss: 1e-3
  tracking_consistency_loss: 1e-1

trainer:
  max_steps: 20000
  val_check_interval: 500
  accumulate_grad_batches: 1

checkpointing:
  every_n_train_steps: 1000
