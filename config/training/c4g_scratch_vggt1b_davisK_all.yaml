# @package _global_

# C4G trained without the C3G gaussian_decoder.ckpt: backbone starts from the
# original VGGT-1B weights (same starting point C3G itself used) and the whole
# Gaussian/time head (gaussian_tokens, gmae_*, time_mlp) is randomly initialized.
# Data, losses and depth supervision mirror the 45k run
# (exp_intrinsic_test_davisK_no_cube_l40s_spring_allfalse_egoexo_mono_45k_resume_from40k_4gpu).
defaults:
  - /dataset@_group_.kubric: kubric
  - /dataset@_group_.spring: spring
  - /dataset@_group_.egoexo4d_mono: egoexo4d_mono
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: vggt
  - override /model/encoder/backbone: vggt_multi
  - override /loss: [dynamicmask, lpips]

wandb:
  name: intrinsic_test_davisK_no_cube_l40s_spring_allfalse_egoexo_mono_scratch_vggt1b_45k_4gpu
  mode: online
  tags: [all, kubric, spring, egoexo4d_mono, re10k, vggt, scratch_head, dynamicmask, track]

force_davis_intrinsics: true

model:
  encoder:
    # Raw VGGT-1B state dict: aggregator -> backbone.aggregator, point_head -> dpt_head.
    pretrained_weights: /music-3d-shared-disk/user/KAIST/MG/InterpolatedC3G/c4g/C3G/pretrained_weights/model.pt
  decoder:
    # C3G gaussian_head warm-up: 10 -> 3.33 -> 1.11 -> 0.37 -> 0.3 (from step 4000).
    make_scale_invariant: true
    low_pass_filter: 10.0
    decrease_lpf_step: 1000

dataset:
  kubric:
    view_sampler:
      warm_up_steps: 37500
  spring:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      gap: 2
      initial_gap: 2
      warm_up_steps: 37500
    different_time: true
    relative_time: false
  egoexo4d_mono:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      warm_up_steps: 37500
  re10k:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      warm_up_steps: 37500

optimizer:
  # C3G gaussian_head recipe for a random head; backbone gets lr * 0.01.
  lr: 1e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.01
  # Put gaussian_tokens / time_mlp in the head group too (otherwise they get the backbone lr).
  scratch_encoder_head_lr: true

data_loader:
  train:
    batch_size: 1

train:
  context_view_loss: true
  reproj_model: moge
  depth_supervision_mode: ssi
  depth_loss: 1e-3
  normal_loss: 1e-3
  tracking_consistency_loss: 1e-1

trainer:
  max_steps: 45000
  val_check_interval: 500
  accumulate_grad_batches: 1

checkpointing:
  load: null
  every_n_train_steps: 1000
