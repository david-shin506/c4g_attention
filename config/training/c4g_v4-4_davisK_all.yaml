# @package _global_

# v4-4 timestep embedding ablation on the current DAVIS-intrinsics setup.
# Same dataset mix as c4g.yaml, but timestep embeddings use the guided-diffusion
# convention: (t - ctx_min) * 1000 / (ctx_max - ctx_min), max_period=10000.

defaults:
  - /dataset@_group_.kubric: kubric
  - /dataset@_group_.spring: spring
  - /dataset@_group_.egoexo4d_mono: egoexo4d_mono
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: vggt
  - override /model/encoder/backbone: vggt_multi
  - override /loss: [dynamicmask, lpips]

wandb:
  name: all_w_re10k_egoexo_v4-4_temb_davisK
  tags: [all, kubric, spring, egoexo4d_mono, re10k, vggt, dynamicmask, track, v4-4, normalize_1000, davisK]

force_davis_intrinsics: true

model:
  encoder:
    pretrained_weights: /music-3d-shared-disk/user/KAIST/MG/InterpolatedC3G/c4g/C3G/pretrained_weights/gaussian_decoder.ckpt
    timestamp_embedding: true
    timestamp_embedding_type: sinusoidal
    sinusoidal_embedding_dim: 256
    gradient_checkpoint: true
    normalize_type: normalize_1000
    sinusoidal_period: 10000

dataset:
  kubric:
    view_sampler:
      warm_up_steps: 37500
  spring:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      gap: 2
      initial_gap: 2
      warm_up_steps: 37500
    different_time: true
    relative_time: false
  egoexo4d_mono:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      warm_up_steps: 37500
  re10k:
    view_sampler:
      num_context_views: 12
      num_target_views: 11
      warm_up_steps: 37500

optimizer:
  lr: 1e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.01

data_loader:
  train:
    batch_size: 1

train:
  context_view_loss: true
  reproj_model: vggt
  depth_supervision_mode: pose_aligned_strict
  strict_depth_loss: log_l1
  depth_confidence_quantile: 0.2
  depth_pose_min_baseline: 1e-4
  depth_pose_min_pair_fraction: 0.2
  depth_pose_max_relative_error: 0.3
  depth_loss: 1e-3
  normal_loss: 1e-3
  tracking_consistency_loss: 1e-1

trainer:
  max_steps: 40000
  val_check_interval: 500
  accumulate_grad_batches: 1

checkpointing:
  every_n_train_steps: 1000
